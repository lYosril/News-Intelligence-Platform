[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "staticfiles", "**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"] # line length is enforced by the formatter

[tool.ruff.lint.per-file-ignores]
# Settings modules intentionally use star imports and re-export config.
"config/settings/*" = ["F403", "F405"]

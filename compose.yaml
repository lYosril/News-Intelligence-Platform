# News Intelligence Platform - development stack
#
#   docker compose up --build
#
# Interpolation: values in ${...} come from a root `.env` file (see
# .env.example) or the shell. Container DNS names (db, redis, backend) are
# used for service-to-service traffic; NEVER localhost inside the network.
#
# Ports on this machine (see README "Ports" - 8000 is occupied by other
# software here, so the backend is published on 8001):
#   frontend  http://localhost:5173   (Vite dev server, hot reload)
#   backend   http://localhost:8001   (Django, proxied by nothing - browser
#                                      calls it directly, which exercises CORS)
#   db        localhost:5433 -> 5432  redis  localhost:6379 -> 6379
name: news-intelligence-platform

# Shared environment for every backend-derived service (backend, worker, beat).
x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.development
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-key-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://localhost:8080}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  # Container-only URL (service DNS "db"). The DATABASE_URL from .env is for
  # running Django on the host and is intentionally not used inside compose.
  DATABASE_URL: postgresql://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD:-dev-only-password}@db:5432/${POSTGRES_DB:-news_intelligence}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
      POSTGRES_DB: ${POSTGRES_DB:-news_intelligence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      # pg_isready ships inside the postgres image.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-news} -d $${POSTGRES_DB:-news_intelligence}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      # redis-cli ships inside the redis image.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: news-intelligence-backend:dev
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1" # backend is the single migration writer
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend:/app # live code, no rebuild needed
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # urllib is stdlib Python - present in the image by definition.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: news-intelligence-backend:dev
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0" # waits for backend (migrations) to be healthy
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      # Broadcasts a ping to this worker; prints "...: OK" when alive.
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$${HOSTNAME} --timeout 10 | grep -q 'OK'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: news-intelligence-backend:dev
    # Explicit schedule path in the container's own tmp dir.
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    # No healthcheck: beat has no ping endpoint and has no dependencies.
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: news-intelligence-frontend:dev
    environment:
      # What the BROWSER uses to reach the backend (host-published port).
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules # keeps host/VM modules apart
    # Deliberately no depends_on: the frontend must render and report accurate
    # connection status whether or not the backend is running.
    healthcheck:
      # Node ships in the node image; check the dev server itself.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5173/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s # includes `npm install` sync at container start
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
